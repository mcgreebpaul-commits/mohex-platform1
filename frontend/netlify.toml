[build]
  command = "npm run build"
  publish = ".netlify/output"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  command = "npm run dev"
  port = 3001

[[redirects]]
  from = "/api/*"
  to = "https://mohex-backend.herokuapp.com/api/:splat"
  status = 200

[context.production.environment]
  NEXT_PUBLIC_SITE_DOMAIN = "mohex.org"
